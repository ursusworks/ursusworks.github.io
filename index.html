<style>
:root { color-scheme: dark; --bg: #0b0d0c; --card: #161a18; --text: #eef2ef; --muted: #a3aca6; --accent: #2bb52b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
header img { width: 56px; height: 56px; border-radius: 12px; }
header a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 22px; }
nav { display: flex; gap: 18px; flex-wrap: wrap; margin: -12px 0 32px; }
nav a { color: var(--muted); }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 16px; }
h2 { font-size: 22px; margin: 36px 0 8px; }
a { color: var(--accent); overflow-wrap: anywhere; }
p { overflow-wrap: anywhere; }
.card { background: var(--card); border-radius: 14px; padding: 20px 24px; margin: 20px 0; }
.muted { color: var(--muted); font-size: 15px; }
code { background: #222826; padding: 1px 6px; border-radius: 4px; font-size: 15px; word-break: break-all; }
table { border-collapse: collapse; width: 100%; font-size: 15px; } td, th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262c29; vertical-align: top; }
